<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  
  <!-- Background Canvas -->
  <rect width="800" height="450" fill="#0F172A"/>
  <rect x="20" y="20" width="760" height="410" fill="#0B132B" stroke="#1E293B" stroke-width="2" rx="8"/>

  <!-- Top Banner / Badge -->
  <rect x="35" y="35" width="730" height="50" fill="#1E293B" rx="6"/>
  <rect x="45" y="45" width="12" height="30" fill="#15803D" rx="2"/>
  <text x="70" y="66" fill="#F8FAFC" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold">Mandovi River Estuary Bridge - Full Elevation Overview</text>
  <rect x="610" y="46" width="145" height="26" fill="#15803D" opacity="0.2" rx="4"/>
  <text x="682" y="63" fill="#15803D" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">FIELD ORTHOPHOTO & ELEVATION</text>

  <!-- Central Technical Graphic -->
  <g transform="translate(0, 10)">
    
            <rect x="40" y="180" width="720" height="20" fill="#334155" rx="3"/>
            <rect x="120" y="200" width="40" height="130" fill="#64748B"/>
            <rect x="280" y="200" width="40" height="130" fill="#64748B"/>
            <rect x="440" y="200" width="40" height="130" fill="#64748B"/>
            <rect x="600" y="200" width="40" height="130" fill="#64748B"/>
            <path d="M 40 310 Q 400 290, 760 310" fill="none" stroke="#0284C7" stroke-width="4"/>
            <circle cx="300" cy="190" r="14" fill="#DC2626" opacity="0.8"/>
            <text x="300" y="194" fill="#FFFFFF" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">!</text>
        
  </g>

  <!-- Bottom Details Bar -->
  <rect x="35" y="360" width="730" height="60" fill="#1E293B" rx="6"/>
  <text x="50" y="382" fill="#94A3B8" font-size="11" font-family="monospace">Asset: Mandovi River Estuary Bridge (ASSET-BRG-001)</text>
  <text x="50" y="402" fill="#94A3B8" font-size="11" font-family="monospace">Commissioned: 1986 | Total Length: 780 meters</text>
  <text x="420" y="382" fill="#CBD5E1" font-size="11" font-family="monospace">Structure: Prestressed Concrete Continuous Girder</text>
  <text x="420" y="402" fill="#15803D" font-size="11" font-family="monospace" font-weight="bold">Environment: High Salinity Marine Atmospheric Zone</text>
