<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  
  <!-- Background Canvas -->
  <rect width="800" height="450" fill="#0F172A"/>
  <rect x="20" y="20" width="760" height="410" fill="#0B132B" stroke="#1E293B" stroke-width="2" rx="8"/>

  <!-- Top Banner / Badge -->
  <rect x="35" y="35" width="730" height="50" fill="#1E293B" rx="6"/>
  <rect x="45" y="45" width="12" height="30" fill="#DC2626" rx="2"/>
  <text x="70" y="66" fill="#F8FAFC" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold">Mithi River Tidal Flap Gate #2 - Silt & Seizure</text>
  <rect x="610" y="46" width="145" height="26" fill="#DC2626" opacity="0.2" rx="4"/>
  <text x="682" y="63" fill="#DC2626" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">CRITICAL ANOMALY AUDIT</text>

  <!-- Central Technical Graphic -->
  <g transform="translate(0, 10)">
    
            <rect x="160" y="90" width="480" height="230" fill="#1E293B" stroke="#EF4444" stroke-width="3" rx="4"/>
            <line x1="280" y1="140" x2="520" y2="250" stroke="#DC2626" stroke-width="12" stroke-linecap="round"/>
            <circle cx="280" cy="140" r="16" fill="#F87171"/>
            <path d="M 200 280 Q 400 240, 600 280" fill="#78350F" opacity="0.9"/>
            <text x="400" y="195" fill="#EF4444" font-size="14" font-family="sans-serif" font-weight="bold" text-anchor="middle">SEIZED AT 18° ANGLE</text>
            <text x="400" y="300" fill="#FEF08A" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">HEAVY TIDAL SILT & BIO-FOULING</text>
        
  </g>

  <!-- Bottom Details Bar -->
  <rect x="35" y="360" width="730" height="60" fill="#1E293B" rx="6"/>
  <text x="50" y="382" fill="#94A3B8" font-size="11" font-family="monospace">Asset: Mithi River Outfall Sluice Gate (ASSET-DRN-006)</text>
  <text x="50" y="402" fill="#94A3B8" font-size="11" font-family="monospace">Flap Gate Position: Mechanically Seized at 18 degrees</text>
  <text x="420" y="382" fill="#CBD5E1" font-size="11" font-family="monospace">Intake Siltation: >65% capacity reduction in wet well</text>
  <text x="420" y="402" fill="#DC2626" font-size="11" font-family="monospace" font-weight="bold">Risk: Severe tidal sea-water backflow during high tides</text>
</svg>