  <text x="70" y="66" fill="#F8FAFC" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold">Peenya 220kV EHV Substation Yard Overview</text>
  <rect x="610" y="46" width="145" height="26" fill="#15803D" opacity="0.2" rx="4"/>
  <text x="682" y="63" fill="#15803D" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">ELECTRICAL GRID TELEMETRY</text>

  <!-- Central Technical Graphic -->
  <g transform="translate(0, 10)">
    
            <rect x="120" y="240" width="120" height="80" fill="#334155"/>
